<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike - Strength Starts Here</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #111;
        }

        /* <video class="vjs-tech" poster="https://images-static.nykaa.com/fashion-images/pub/media/nike-images/nike/dweb_2008.png_1?tr=w-1536" playsinline="playsinline" id="vjs_video_79999_html5_api" tabindex="-1" loop="" muted="muted" autoplay="" src="https://prod-assets.nike.in/NIKE/nes-nike-reloaded-svc/static/assets/videos/hls/hls_segments/dweb_2008/output.m3u8"></video> */

        /* Navbar */
        nav {
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: white;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            font-style: italic;
        }

        .menu {
            display: flex;
            gap: 25px;
            list-style: none;
            font-size: 14px;
        }

        .icons {
            display: flex;
            gap: 20px;
            font-size: 20px;
        }

        /* Promo bar */
        .promo {
            text-align: center;
            background: #f5f5f5;
            padding: 8px;
            font-size: 12px;
        }

        .promo a {
            color: #111;
        }

        /* Hero */
        .hero {
            height: calc(100vh - 95px);
            min-height: 500px;
            background:
                linear-gradient(rgba(0, 10, 40, .35), rgba(0, 10, 40, .35)),
                url("hero.jpg") center/cover no-repeat;
                        /* <video class="vjs-tech" poster="https://images-static.nykaa.com/fashion-images/pub/media/nike-images/nike/dweb_2008.png_1?tr=w-1536" playsinline="playsinline" id="vjs_video_79999_html5_api" tabindex="-1" loop="" muted="muted" autoplay="" src="https://prod-assets.nike.in/NIKE/nes-nike-reloaded-svc/static/assets/videos/hls/hls_segments/dweb_2008/output.m3u8"></video> */


            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .content h1 {
            font-size: 50px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .content p {
            font-size: 14px;
            margin-bottom: 18px;
        }

        .buttons button {
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            margin: 0 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #ddd;
        }

        /* Bottom slider dots */
        .dots {
            position: absolute;
            bottom: 18px;
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #888;
            border-radius: 50%;
        }

        .dot.active {
            background: white;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .menu {
                display: none;
            }

            nav {
                padding: 0 15px;
            }

            .content h1 {
                font-size: 34px;
            }

            .hero {
                min-height: 600px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">✓</div>

        <ul class="menu">
            <li>Sale</li>
            <li>New & Featured</li>
            <li>Men</li>
            <li>Women</li>
            <li>Kids</li>
            <li>Jordan</li>
        </ul>

        <div class="icons">
            <span>⌕</span>
            <span>♡</span>
            <span>♧</span>
        </div>
    </nav>

    <!-- Promotion -->
    <div class="promo">
        Enjoy 15% Off On The Nike App. Use: APP15
        <br>
        <a href="#">Download Now</a> &nbsp; | &nbsp; <a href="#">T&Cs</a>
    </div>

    <!-- Hero -->
    <section class="hero">
        

        <div class="content">
            <h1>STRENGTH STARTS HERE</h1>

            <p>Power your potential with the Metcon 10</p>

            <div class="buttons">
                <button>Shop</button>
                <button>Watch ▶</button>
            </div>
        </div>

        <!-- Slider dots -->
        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

    </section>

</body>

</html>
